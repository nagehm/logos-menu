<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوجوس للأكل المصري - المنيو الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">
    <header class="bg-slate-900 text-white px-6 py-4 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🏺</span>
            <div>
                <h1 class="text-xl font-bold">لوجوس للأكل المصري</h1>
                <p class="text-xs text-amber-400 font-semibold">أسعار محدثة مباشرة من شيت الإدارة</p>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24">
        <div id="loading-spinner" class="text-center py-20 text-slate-500 font-bold">جاري تحميل أحدث الأسعار من الشيت... 🔄</div>
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-5xl mx-auto"></div>
    </main>

    <div id="floating-cart" class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white p-4 shadow-2xl transition-transform duration-300 translate-y-full z-30">
        <div class="max-w-xl mx-auto flex justify-between items-center cursor-pointer" onclick="toggleCartModal()">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-900 font-black w-10 h-10 rounded-xl flex items-center justify-center text-lg" id="cart-count">0</div>
                <div><h3 class="font-bold text-sm">سلة المشتريات</h3></div>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-lg font-black text-amber-400" id="cart-total-price">0.00 ج.م</span>
                <button class="bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-xl text-sm">عرض السلة 🛒</button>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-40 flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">🛒 تفاصيل السلة</h3>
                <button onclick="toggleCartModal()" class="text-slate-400 text-xl font-bold">&times;</button>
            </div>
            <div id="cart-items-container" class="flex-1 overflow-y-auto p-4 divide-y"></div>
            <div class="p-4 bg-slate-50 border-t space-y-3">
                <input type="text" id="table-number" placeholder="رقم الطاولة (مثال: طاولة 5)" class="w-full border rounded-xl px-3 py-2 text-xs">
                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm">💬 إرسال الطلب عبر واتساب</button>
            </div>
        </div>
    </div>

    <script>
        // تم ربط رابط الـ API الخاص بك بنجاح 👇
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzh4dPN9fSNznTnDDV0AKCXjlNpPLdyJ6lwyeWdjt3X0IwTWdgEboJSHnMCmYNNA_do/exec";

        let menuItems = [];
        let cart = {};

        async function fetchMenu() {
            try {
                const response = await fetch(GOOGLE_SHEET_API_URL);
                menuItems = await response.json();
                document.getElementById('loading-spinner').style.display = 'none';
                renderMenu(menuItems);
            } catch (error) {
                document.getElementById('loading-spinner').innerHTML = "⚠️ عذراً، تأكد من الاتصال بالإنترنت لجلب القائمة.";
            }
        }

        function renderMenu(items) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            items.forEach(item => {
                let qty = cart[item.id] ? cart[item.id].qty : 0;
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative mb-3">
                            <img src="${item.img}" class="w-full h-36 object-cover rounded-xl" onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400'">
                            <span class="absolute top-2 left-2 bg-slate-900/80 text-amber-400 font-bold px-2 py-1 rounded-lg text-xs">${item.price} ج.م</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm mb-1">${item.name}</h3>
                        <p class="text-xs text-slate-500 mb-3">${item.desc}</p>
                    </div>
                    <div>
                        ${qty === 0 ? `
                            <button onclick="updateQty('${item.id}', 1)" class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs">➕ إضافة للسلة</button>
                        ` : `
                            <div class="flex items-center justify-between bg-slate-100 rounded-xl p-1 border">
                                <button onclick="updateQty('${item.id}', -1)" class="bg-white w-7 h-7 rounded font-bold">-</button>
                                <span class="font-bold text-sm">${qty}</span>
                                <button onclick="updateQty('${item.id}', 1)" class="bg-amber-500 w-7 h-7 rounded font-bold">+</button>
                            </div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, change) {
            if(!cart[id]) {
                if(change > 0) {
                    const item = menuItems.find(i => i.id === id);
                    cart[id] = { ...item, qty: 1 };
                }
            } else {
                cart[id].qty += change;
                if(cart[id].qty <= 0) delete cart[id];
            }
            renderMenu(menuItems);
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('floating-cart');
            const cartContainer = document.getElementById('cart-items-container');
            let totalCount = 0, subtotal = 0;
            cartContainer.innerHTML = '';
            const keys = Object.keys(cart);
            if(keys.length === 0) { cartBar.classList.add('translate-y-full'); return; }
            cartBar.classList.remove('translate-y-full');
            keys.forEach(id => {
                const item = cart[id];
                totalCount += item.qty;
                subtotal += item.price * item.qty;
                cartContainer.innerHTML += `<div class="py-2 flex justify-between text-xs"><span>${item.name} (×${item.qty})</span> <span class="font-bold">${item.price * item.qty} ج.م</span></div>`;
            });
            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total-price').innerText = (subtotal * 1.14).toFixed(2) + " ج.م";
        }

        function toggleCartModal() { document.getElementById('cart-modal').classList.toggle('hidden'); }

        function sendWhatsAppOrder() {
            const table = document.getElementById('table-number').value.trim();
            if(!table) { alert("أدخل رقم الطاولة!"); return; }
            let text = `🏺 طلب جديد - لوجوس\n🪑 ${table}\n\n`;
            let sub = 0;
            Object.values(cart).forEach(i => {
                text += `▫️ ${i.name} (×${i.qty}) - ${i.price * i.qty} ج.م\n`;
                sub += i.price * i.qty;
            });
            text += `\nالإجمالي بالضريبة: ${(sub * 1.14).toFixed(2)} ج.م`;
            window.open(`https://wa.me/201027808157?text=${encodeURIComponent(text)}`, '_blank');
        }

        fetchMenu();
    </script>
</body>
</html>
